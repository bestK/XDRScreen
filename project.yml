# XcodeGen spec for XDRScreen.
#
# The generated XDRScreen.xcodeproj is checked in, so building does not require
# xcodegen. Regenerate after adding/removing targets with:
#
#     xcodegen generate
#
# Source directories are referenced as folders, so new Swift files dropped into
# MacHost/, iPadClient/ or Shared/ are picked up automatically after regenerating.

name: XDRScreen

options:
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    macOS: "15.0"
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    DEVELOPMENT_LANGUAGE: en
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  # macOS host: captures the display, encodes HEVC, serves the Bonjour listener.
  # Not sandboxed so Screen Recording and Accessibility permissions can be
  # requested and used.
  XDRScreenHost:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: MacHost
      - path: VirtualDisplay
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: XDRScreenHost
        PRODUCT_BUNDLE_IDENTIFIER: dev.xdrscreen.host
        INFOPLIST_FILE: Config/macOS-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  # iPadOS client: decodes and displays the remote screen, sends input back.
  XDRScreen:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iPadClient
      - path: HDRRenderer
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: XDRScreen
        PRODUCT_BUNDLE_IDENTIFIER: dev.xdrscreen.ipad2bkh54
        INFOPLIST_FILE: Config/iPadOS-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  XDRScreenHost:
    build:
      targets:
        XDRScreenHost: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  XDRScreen:
    build:
      targets:
        XDRScreen: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
